name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # mise.toml pins the toolchain and the environment (GOWORK=off). Every
      # step below is a Makefile target, so CI and a local `make ci` run the
      # same commands.
      - name: Set up toolchain (mise)
        uses: jdx/mise-action@v2

      - name: Go version
        run: go version

      # Quality gate: sources must be gofmt-clean.
      - name: Format check (gofmt)
        run: make fmt-check

      - name: Vet
        run: make vet

      - name: Build
        run: make build

      # Architecture gate (AD-3 / NFR2): `go generate` is a build step and a
      # validation gate — a bad registration graph (missing / captive / cyclic)
      # must be rejected and produce ZERO code, and committed generated code
      # (container_gen.go) must never drift from its source DSL.
      - name: Generate gate (drift + bad-graph rejection)
        run: make generate-check

      - name: Changelog check (both languages list the same versions)
        run: make changelog-check

      # Architecture (ARCHITECTURE-SPINE / acceptance-contract): the conformance
      # dual-provider suite and the golden generation tests, with the race
      # detector and coverage as the quality gate.
      - name: Test (race + coverage)
        run: make test

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: ignore
